services:
  user-service:
    build: .
    ports:
      - "5050:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: 3000
      MONGO_URL: mongodb://root:root@mongo:27017/?authSource=admin
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:


